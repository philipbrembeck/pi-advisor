name: Tag package releases

on:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: write

concurrency:
  group: package-release-tag
  cancel-in-progress: false

jobs:
  validate:
    name: Validate before tagging
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run release gates
        run: |
          bun run typecheck
          bun run test
          bun run lint
          bun run build
          git diff --exit-code -- dist/index.js
          test -z "$(git status --porcelain --untracked-files=all -- dist/index.js)"
          bun run package:check
          git diff --exit-code -- dist/index.js
          test -z "$(git status --porcelain --untracked-files=all -- dist/index.js)"
          bun audit --audit-level=high

  tag:
    name: Create package version tag
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Create package version tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous_version="$(git show "${{ github.event.before }}:package.json" 2>/dev/null | node -e 'let s=""; process.stdin.on("data", d => s += d).on("end", () => console.log(JSON.parse(s).version))' || true)"
          version="$(node -p "require('./package.json').version")"
          if [ "$version" = "$previous_version" ]; then
            echo "package.json version unchanged; no release tag needed."
            exit 0
          fi
          if ! node -e 'const v = process.argv[1]; if (!/^\d+\.\d+\.\d+$/.test(v)) process.exit(1)' "$version"; then
            echo "Invalid package version: $version" >&2
            exit 1
          fi
          tag="v$version"
          created=false
          existing_commit="$(git ls-remote origin "refs/tags/$tag^{}" | awk '{print $1}')"
          if [ -n "$existing_commit" ]; then
            if [ "$existing_commit" != "${{ github.sha }}" ]; then
              echo "Tag $tag already exists at $existing_commit, not ${{ github.sha }}." >&2
              exit 1
            fi
            echo "Tag $tag already points at this commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" -m "Release $tag"
            git push origin "$tag"
            created=true
          fi
          if [ "$created" = true ]; then
            gh workflow run publish.yml --ref "$tag"
          fi
